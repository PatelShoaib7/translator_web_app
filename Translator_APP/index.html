<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Translator</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-language"></i>
                <h1>DevTranslate</h1>
            </div>

            <div class="header-actions">
                <span id="status-badge" class="status-badge">Ready</span>
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="Switch Day / Light & Night Mode">
                    <i class="fa-solid fa-moon"></i>
                    <span id="theme-label">Night Mode</span>
                </button>
            </div>
        </header>

        <!-- Main Translator Card -->
        <main class="translator-card">
            <!-- Language Selector Bar -->
            <div class="controls-bar">
                <select id="source-lang" aria-label="Source Language"></select>

                <button id="swap-btn" class="icon-btn swap-btn" title="Swap Languages">
                    <i class="fa-solid fa-right-left"></i>
                </button>

                <select id="target-lang" aria-label="Target Language"></select>
            </div>

            <!-- Side-by-Side Text Panels -->
            <div class="panels">
                <!-- Input Panel -->
                <div class="panel">
                    <label for="input-text" class="panel-label">Source Text</label>
                    <textarea id="input-text" maxlength="500" placeholder="Enter text to translate..."></textarea>

                    <div class="panel-footer">
                        <div class="tool-buttons">
                            <button id="speak-input-btn" class="icon-btn" title="Listen">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <button id="copy-input-btn" class="icon-btn" title="Copy text">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            <button id="clear-btn" class="clear-btn" title="Clear text">
                                Clear
                            </button>
                        </div>
                        <span id="char-count" class="char-count">0 / 500</span>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="panel output-panel">
                    <label for="output-text" class="panel-label">Translated Output</label>
                    <textarea id="output-text" placeholder="Translation will appear here..." readonly></textarea>

                    <div class="panel-footer">
                        <div class="tool-buttons">
                            <button id="speak-output-btn" class="icon-btn" title="Listen">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <button id="copy-output-btn" class="icon-btn" title="Copy translation">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                        <span id="error-msg" class="error-msg"></span>
                    </div>
                </div>
            </div>

            <!-- Translate Action Bar -->
            <div class="action-bar">
                <button id="translate-btn" class="translate-btn">
                    <span>Translate Text</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </main>

        <!-- Recent Translations History -->
        <section class="history-card">
            <div class="history-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> Recent Translations</h2>
                <button id="clear-history-btn" class="clear-history-btn">Clear History</button>
            </div>
            <ul id="history-list" class="history-list"></ul>
        </section>
    </div>

    <!-- Main JavaScript -->
    <script src="script.js"></script>
</body>

</html>
